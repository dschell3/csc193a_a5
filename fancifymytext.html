<!DOCTYPE html>
<html>
	<head>
		<title>Fancify Shamcify</title>

		<!-- link to your script file here -->
		<script src="fancifymytext.js"></script>
		

	</head>

	<body>
		<h1>Fancify my Text</h1>

		<!-- Your UI controls go here -->

		<!-- Text box: 4 rows x 30 cols, inside a bordered fieldset -->
		<fieldset>
			<legend>Text</legend>
			<textarea id="userText" rows="4" cols="30"></textarea>
		</fieldset>

		<!-- Styling controls -->
		<fieldset>
			<legend>Fancify</legend>

			<button type="button" onclick="makeBigger()">Bigger!</button>
			
			<!-- Same name so only one radio can be picked at a time -->
			<label>
				<input type="radio" id="fancy" name="style" onchange="changeStyle()">
				FancyShmancy
			</label>
			<label>
				<input type="radio" id="boring" name="style" onchange="changeStyle()">
				BoringBetty
			</label>
		</fieldset>
	</body>
</html>
